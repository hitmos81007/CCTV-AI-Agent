<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CCTV Evidence Review</title>
  <style>
    :root { color-scheme: dark; --bg:#101820; --panel:#18232d; --line:#2c3a46; --text:#e8eef3; --muted:#a8b6c2; --accent:#79c0a4; --warn:#e4c178; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,Segoe UI,sans-serif; }
    main { max-width:1180px; margin:auto; padding:32px 20px 64px; } header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:28px; } h2 { margin:0 0 14px; font-size:18px; } p { color:var(--muted); margin:6px 0; }
    .badge { border:1px solid #806f44; background:#342d1c; color:#f3d791; border-radius:999px; padding:4px 10px; font-size:12px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin:18px 0; }
    .controls { display:flex; gap:10px; align-items:center; } input,select,button { border:1px solid var(--line); border-radius:8px; color:var(--text); background:#111a22; padding:9px 11px; font:inherit; }
    button { cursor:pointer; } button:hover { border-color:var(--accent); } .primary { background:#1e4237; border-color:#39745f; } .quiet { background:transparent; }
    .grid { display:grid; grid-template-columns:1.2fr 1fr; gap:18px; } .meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 16px; margin:12px 0; }
    .meta div { color:var(--muted); overflow-wrap:anywhere; } .meta strong { color:var(--text); font-weight:600; }
    video { width:100%; max-height:350px; background:#06090c; border-radius:10px; } .hash { font:12px ui-monospace,monospace; color:#b9c8d4; overflow-wrap:anywhere; }
    .review { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; } .empty { border:1px dashed var(--line); padding:24px; color:var(--muted); border-radius:10px; }
    @media(max-width:780px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Evidence review</h1><p>Review actual vehicle tracks from uploaded footage. Findings remain pending until a reviewer records a decision.</p></div><span class="badge">Human review required · No facial identification</span></header>
  <section class="panel">
    <div class="controls"><label for="case">Case filter</label><input id="case" placeholder="All cases"><button id="refresh" class="primary">Refresh</button><span id="count" aria-live="polite"></span></div>
  </section>
  <section id="items" aria-live="polite"></section>
</main>
<script>
const items = document.getElementById('items');
const count = document.getElementById('count');
const escapeText = value => String(value ?? '—');
function element(tag, text, className) { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (className) el.className = className; return el; }
async function refresh() {
  items.replaceChildren(element('div','Loading review records…','empty'));
  const caseId = document.getElementById('case').value.trim();
  const url = new URL('/api/v1/sightings', location.origin); if (caseId) url.searchParams.set('case_id',caseId);
  try {
    const response = await fetch(url); if (!response.ok) throw new Error(`API returned ${response.status}`);
    const records = await response.json(); count.textContent = `${records.length} record${records.length===1?'':'s'}`; items.replaceChildren();
    if (!records.length) { items.append(element('div','No video-derived sightings are stored. Upload a public or synthetic clip and run a zone analysis first.','empty')); return; }
    for (const record of records) {
      const card = element('article',undefined,'panel'); const title = element('h2',`${escapeText(record.vehicle_color)} ${escapeText(record.vehicle_type)} · ${escapeText(record.jurisdiction)}`); card.append(title);
      const grid = element('div',undefined,'grid'); const media = document.createElement('video'); media.controls = true; media.preload = 'metadata'; media.src = `/api/v1/videos/${encodeURIComponent(record.video_source_id)}/file#t=${Number(record.video_offset_seconds)||0}`;
      const info = element('div'); const meta = element('div',undefined,'meta');
      for (const [label,value] of [['Case',record.case_id],['Camera',record.camera_id],['Timestamp',record.occurred_at],['Detector confidence',Number(record.detector_confidence).toFixed(3)],['Clue comparison',record.clue_match_score==null?'not scored':Number(record.clue_match_score).toFixed(2)],['Review',record.review_status]]) { const row=element('div'); row.append(element('strong',`${label}: `),document.createTextNode(escapeText(value))); meta.append(row); }
      info.append(meta,element('div',`Evidence SHA-256: ${record.evidence_sha256}`,'hash'));
      const note = document.createElement('input'); note.placeholder = 'Reviewer note (optional)'; note.maxLength = 2000; note.setAttribute('aria-label','Reviewer note');
      const reviewer = document.createElement('input'); reviewer.value = 'Reviewer'; reviewer.maxLength = 120; reviewer.setAttribute('aria-label','Reviewer name');
      const actions=element('div',undefined,'review');
      for (const [label,decision] of [['Confirm candidate','confirmed_candidate'],['Not relevant','not_relevant'],['Needs more review','needs_more_review']]) {
        const button=element('button',label,decision==='confirmed_candidate'?'primary':'quiet');
        button.addEventListener('click',async()=>{ button.disabled=true; try { const response=await fetch(`/api/v1/sightings/${encodeURIComponent(record.id)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reviewer:reviewer.value||'Reviewer',note:note.value})}); if(!response.ok) throw new Error((await response.json()).detail||`API returned ${response.status}`); await refresh(); } catch(error) { alert(`Review was not saved: ${error.message}`); button.disabled=false; } }); actions.append(button);
      }
      info.append(reviewer,note,actions); grid.append(media,info); card.append(grid); items.append(card);
    }
  } catch(error) { count.textContent=''; items.replaceChildren(element('div',`Could not load review records: ${error.message}`,'empty')); }
}
document.getElementById('refresh').addEventListener('click',refresh); refresh();
</script>
</body>
</html>
